<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的评分记录</title>
    <link rel="stylesheet" href="/css/customHeaderAndBody.css">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
    #app header {
        position: relative;
        justify-content: space-around; /* 水平分布 */
        align-items: center; /* 垂直居中 */
    }
    </style>
</head>
<body>
    <header>
        <h5><a href="/ame/view/index">首页</a></h5>
        <h5><a href="/ame/view/list">动画大全</a></h5>
        <h5><a href="/ame/view/recommendation">获取推荐</a></h5>
        <h5><a href="/ame/view/chat">聊天室</a></h5>
        <h5><a href="/ame/view/userInfo">个人中心</a></h5>
    </header>
    <div id="app">
        <header style="margin-bottom: 5px; margin-left: 0">
            <h5><a href="/ame/view/userInfo">个人信息</a></h5>
            <h5><a href="/ame/view/myRating">我的评分</a></h5>
            <h5><a href="/ame/view/myCollection">我的收藏</a></h5>
            <h5><button class="custom-button">退出账号</button></h5>
        </header>
        <div class="root">
            <input type="hidden" id="userId" th:value="${user.userId}">
            <div class="card" v-for="item in ratingList" :key="item.ratingId">
                <img :src="item.pic" alt="">
                <p>评分：{{item.rating}}</p>
                <p>评论：{{item.comment}}</p>
                <p><a v-bind:href="`/ame/view/anime/`+item.animeId"><button class="custom-button">查看详情</button></a></p>
            </div>
        </div>
    </div>
</body>
<script src="https://cdn.bootcdn.net/ajax/libs/vue/2.6.13/vue.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/axios/1.7.2/axios.js"></script>
<script>
    axios.defaults.baseURL = 'http://localhost:1888';

    new Vue({
        el:'#app',
        data(){
            return{
                userId:document.getElementById("userId").value,
                ratingList:[],
            }
        },
        mounted(){
            this.getRatingList()
        },
        methods:{
            getRatingList(){
                let _ = this
                axios.get("/ame/myRatings", { params: { userId: _.userId} }).then(resp=>{
                    _.ratingList = resp.data
                    console.log(resp.data)
                    _.ratingList.forEach(rating => {
                        axios.get(`https://api.jikan.moe/v4/anime/${rating.animeId}/pictures`)
                            .then(resp => {
                                // 更新 rating 对象的 pic 属性
                                Vue.set(rating, 'pic', resp.data.data[0].jpg.image_url);
                            })
                            .catch(error => {
                                console.error("获取图片失败:", error);
                                // 如果请求失败，设置一个默认图片
                                Vue.set(rating, 'pic', '/img/OIP-C.jpg');
                            });

                    });
                }).catch(error => {
                    console.error("获取评分记录失败:", error);
                });
            }
        }
    })
</script>
<script type="module" src="/js/dynamicBackground.js"></script>
</html>
