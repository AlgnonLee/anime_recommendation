<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>首页</title>
    <link rel="stylesheet" href="/css/customHeaderAndBody.css">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>
    <header>
        <h5><a href="/ame/view/index">首页</a></h5>
        <h5><a href="/ame/view/list">动画大全</a></h5>
        <h5><a href="/ame/view/recommendation">获取推荐</a></h5>
        <h5><a href="/ame/view/chat">聊天室</a></h5>
        <h5><a href="/ame/view/userInfo">个人中心</a></h5>
    </header>
    <div id="app">
        <div class="root">
            <div class="card" v-for="item in animeList">
                <img :src="item.pic" alt="">
                <h3>动画名称:{{item.title}}</h3>
                <p>评分：{{item.rating}}</p>
                <p><a v-bind:href="`/ame/view/anime/`+item.animeId"><button class="custom-button">查看详情</button></a></p>
            </div>
        </div>
    </div>
</body>
<script src="https://cdn.bootcdn.net/ajax/libs/vue/2.6.13/vue.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/axios/1.7.2/axios.js"></script>
<script>
    axios.defaults.baseURL = 'http://localhost:1888';


    new Vue({
        el:'#app',
        data(){
            return{
                animeList:[],
            }
        },
        mounted(){
            this.getAnimeList()
        },
        methods:{
            getAnimeList(){
                let _ = this
                axios.get("/ame/animes/random").then(resp=>{
                    _.animeList = resp.data
                    console.log(resp.data)
                    _.animeList.forEach(anime => {
                        axios.get(`https://api.jikan.moe/v4/anime/${anime.animeId}/pictures`)
                            .then(resp => {
                                // 更新 anime 对象的 pic 属性
                                Vue.set(anime, 'pic', resp.data.data[0].jpg.image_url);
                            })
                            .catch(error => {
                                console.error("获取图片失败:", error);
                                // 如果请求失败，设置一个默认图片
                                Vue.set(anime, 'pic', '/img/OIP-C.jpg');
                            });

                    });
                }).catch(error => {
                    console.error("获取动画列表失败:", error);
                });
            }
        }
    })
</script>
<script type="module" src="/js/dynamicBackground.js"></script>
</html>
